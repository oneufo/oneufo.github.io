<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>要闻 · Dispatch</title>
<style>
/* ── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:       #f9f9f8;
  --surface:  #ffffff;
  --border:   rgba(0,0,0,0.08);
  --border-md:rgba(0,0,0,0.13);
  --text-1:   #0f0f0f;
  --text-2:   #5a5a5a;
  --text-3:   #9a9a9a;
  --accent:   #d97706;
  --accent-bg:#fef3c7;
  --accent-t: #92400e;
  --tag-geo:  #dbeafe; --tag-geo-t:#1e3a5f;
  --tag-pol:  #fce7f3; --tag-pol-t:#831843;
  --tag-biz:  #d1fae5; --tag-biz-t:#064e3b;
  --tag-tech: #ede9fe; --tag-tech-t:#4c1d95;
  --tag-hlth: #fee2e2; --tag-hlth-t:#7f1d1d;
  --tag-sci:  #e0f2fe; --tag-sci-t:#0c4a6e;
  --tag-cli:  #dcfce7; --tag-cli-t:#14532d;
  --radius:   6px;
  --radius-lg:12px;
  --shadow:   0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
}
[data-theme="dark"] {
  --bg:       #0f0f0f;
  --surface:  #1a1a1a;
  --border:   rgba(255,255,255,0.08);
  --border-md:rgba(255,255,255,0.14);
  --text-1:   #f0f0f0;
  --text-2:   #999;
  --text-3:   #555;
  --accent:   #f59e0b;
  --accent-bg:#292218;
  --accent-t: #fcd34d;
  --tag-geo:  #1e3046; --tag-geo-t:#93c5fd;
  --tag-pol:  #3b0a24; --tag-pol-t:#f9a8d4;
  --tag-biz:  #052e1c; --tag-biz-t:#6ee7b7;
  --tag-tech: #2e1a4e; --tag-tech-t:#c4b5fd;
  --tag-hlth: #3a0e0e; --tag-hlth-t:#fca5a5;
  --tag-sci:  #0a2535; --tag-sci-t:#7dd3fc;
  --tag-cli:  #052612; --tag-cli-t:#86efac;
  --shadow:   0 1px 3px rgba(0,0,0,0.3);
  --shadow-md:0 4px 12px rgba(0,0,0,0.4);
}

/* ── RESET ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text-1);
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  transition: background .25s, color .25s;
}
button { cursor: pointer; font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ── LAYOUT ─────────────────────────────────────────── */
.shell {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ── TOPBAR ─────────────────────────────────────────── */
.topbar {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 90;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.topbar-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 52px;
  padding: 0 24px;
  max-width: 1160px;
  margin: 0 auto;
}
.wordmark {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.4px;
  color: var(--text-1);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wordmark-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }

.topbar-date {
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
}
.topbar-spacer { flex: 1; }
.ticker-strip {
  flex: 1;
  overflow: hidden;
  font-size: 12px;
  color: var(--text-2);
  max-width: 420px;
}
.ticker-inner {
  display: flex;
  gap: 40px;
  white-space: nowrap;
  animation: tk 55s linear infinite;
}
.ticker-inner:hover { animation-play-state: paused; }
@keyframes tk { from{transform:translateX(0);} to{transform:translateX(-50%);} }
.tk-item::before { content: '·'; margin-right: 8px; color: var(--accent); }

.theme-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border-md);
  background: var(--bg);
  color: var(--text-2);
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
  flex-shrink: 0;
}
.theme-btn:hover { background: var(--border); }

/* ── PROGRESS BAR ───────────────────────────────────── */
.prog-bar {
  height: 2px;
  background: var(--border);
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .8s linear;
}

/* ── SUBNAV ─────────────────────────────────────────── */
.subnav {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  overflow-x: auto;
  scrollbar-width: none;
}
.subnav::-webkit-scrollbar { display: none; }
.subnav-inner {
  display: flex;
  gap: 2px;
  padding: 8px 24px;
  max-width: 1160px;
  margin: 0 auto;
}
.cat-pill {
  flex-shrink: 0;
  padding: 5px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  background: none;
  border: 1px solid transparent;
  transition: all .15s;
  letter-spacing: .01em;
}
.cat-pill:hover { background: var(--bg); border-color: var(--border-md); color: var(--text-1); }
.cat-pill.on {
  background: var(--accent-bg);
  color: var(--accent-t);
  border-color: transparent;
}

/* ── MAIN GRID ──────────────────────────────────────── */
.main { padding: 28px 24px 80px; max-width: 1160px; margin: 0 auto; }

/* stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 28px;
  animation: fadeUp .5s both;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.stat-n {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.5px;
  color: var(--accent);
  line-height: 1.1;
  margin-bottom: 4px;
}
.stat-d {
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.4;
}

/* section head */
.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  margin-top: 32px;
}
.section-head:first-child { margin-top: 0; }
.section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-3);
}
.section-line { flex: 1; height: 1px; background: var(--border); }

/* feature card */
.feature-card {
  display: grid;
  grid-template-columns: 1fr 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  animation: fadeUp .5s .05s both;
  transition: box-shadow .2s;
}
.feature-card:hover { box-shadow: var(--shadow-md); }
.fc-body { padding: 28px 28px 24px; }
.fc-side {
  border-left: 1px solid var(--border);
  padding: 28px 22px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* standard cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}
.cards-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.news-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 20px 16px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, transform .2s;
  animation: fadeUp .5s both;
  display: flex;
  flex-direction: column;
}
.news-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.news-card:nth-child(2){animation-delay:.07s;}
.news-card:nth-child(3){animation-delay:.14s;}

/* tags */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 3px 9px;
  border-radius: 4px;
  margin-bottom: 11px;
}
.tag-geo  { background:var(--tag-geo);  color:var(--tag-geo-t);  }
.tag-pol  { background:var(--tag-pol);  color:var(--tag-pol-t);  }
.tag-biz  { background:var(--tag-biz);  color:var(--tag-biz-t);  }
.tag-tech { background:var(--tag-tech); color:var(--tag-tech-t); }
.tag-hlth { background:var(--tag-hlth); color:var(--tag-hlth-t); }
.tag-sci  { background:var(--tag-sci);  color:var(--tag-sci-t);  }
.tag-cli  { background:var(--tag-cli);  color:var(--tag-cli-t);  }

/* headlines */
.hl-feat {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -.4px;
  color: var(--text-1);
  margin-bottom: 12px;
}
.hl-feat em { color: var(--accent); font-style: normal; }
.hl-card {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.38;
  letter-spacing: -.2px;
  color: var(--text-1);
  margin-bottom: 9px;
  flex: 0;
}
.hl-card em { color: var(--accent); font-style: normal; }
.body-txt {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.65;
  margin-bottom: 14px;
  flex: 1;
}
.body-sm {
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.6;
  flex: 1;
  margin-bottom: 12px;
}

/* importance */
.imp-wrap { margin-top: auto; }
.imp-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.imp-label {
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
}
.imp-score {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
}
.imp-track {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.imp-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  opacity: .7;
}
.src-txt {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 6px;
}

/* side panel items */
.side-item {}
.side-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 5px;
}
.side-val {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
}
.impact-chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  color: var(--accent-t);
  background: var(--accent-bg);
  padding: 4px 10px;
  border-radius: 4px;
}

/* footer */
.footer {
  border-top: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1160px;
  margin: 0 auto;
}
.footer-l, .footer-r { font-size: 11px; color: var(--text-3); }
#nxt { color: var(--accent); }

/* empty */
.empty {
  padding: 60px 0;
  text-align: center;
  color: var(--text-3);
  font-size: 14px;
}

/* animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* responsive */
@media (max-width: 860px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .stat-card:last-child { display: none; }
  .feature-card { grid-template-columns: 1fr; }
  .fc-side { display: none; }
  .cards-grid { grid-template-columns: 1fr; }
  .cards-grid-2 { grid-template-columns: 1fr; }
  .ticker-strip { display: none; }
  .topbar-date { display: none; }
}
@media (max-width: 500px) {
  .stats-row { grid-template-columns: 1fr 1fr; }
  .shell { padding: 0 16px; }
  .main { padding: 20px 16px 60px; }
  .subnav-inner { padding: 8px 16px; }
  .topbar-inner { padding: 0 16px; }
  .footer { padding: 14px 16px; }
}
</style>
</head>

<!-- TOP BAR -->
<div class="topbar">

  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
</div>

<!-- SUB NAV -->
<div class="subnav">
  <div class="subnav-inner" id="nav">
    <button class="cat-pill on" data-c="all">全部</button>

    <button class="cat-pill" data-c="climate">气候</button>
  </div>
</div>

<!-- MAIN -->
<main class="main" id="grid"></main>

<!-- FOOTER -->
<footer class="footer">
  <span class="footer-l">要闻 · Dispatch · 2026</span>
  <span class="footer-r">下次更新 <span id="nxt">—</span></span>
</footer>

// ── helpers ───────────────────────────────────────────
function tagHTML(cat) {
  const [label, cls] = TAG_MAP[cat] || ['新闻','tag-geo'];
  return `<span class="tag ${cls}">${label}</span>`;
}

function impBar(v) {
  return `<div class="imp-wrap">
    <div class="imp-row">
      <span class="imp-label">重要程度</span>
      <div class="imp-track"><div class="imp-fill" style="width:${v}%"></div></div>
      <span class="imp-score">${v}</span>
    </div>
  </div>`;
}

function featHTML(d) {
  return `<div class="feature-card">
    <div class="fc-body">
      ${tagHTML(d.cat)}
      <div class="hl-feat">${d.hl}</div>
      <div class="body-txt">${d.body}</div>
      ${impBar(d.imp)}
      <div class="src-txt">${d.src}</div>
    </div>
    <div class="fc-side">
      <div class="side-item">
        <div class="side-label">影响评估</div>
        <span class="impact-chip">${d.impact}</span>
      </div>
      <div class="side-item">
        <div class="side-label">重要程度</div>
        <div style="font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-.5px;line-height:1;">${d.imp}<span style="font-size:14px;font-weight:400;color:var(--text-3);">/100</span></div>
      </div>
      <div class="side-item" style="margin-top:auto;">
        <div class="side-label">来源</div>
        <div class="side-val">${d.src}</div>
      </div>
    </div>
  </div>`;
}

function cardHTML(d) {
  return `<div class="news-card">
    ${tagHTML(d.cat)}
    <div class="hl-card">${d.hl}</div>
    <div class="body-sm">${d.body}</div>
    ${impBar(d.imp)}
    <div class="src-txt">${d.src}</div>
  </div>`;
}

function statsHTML() {
  return `<div class="stats-row">${STATS.map(s =>
    `<div class="stat-card">
      <div class="stat-n">${s.n}</div>
      <div class="stat-d">${s.d.replace('\n','<br>')}</div>
    </div>`).join('')}</div>`;
}

function secHead(t) {
  return `<div class="section-head"><div class="section-line"></div><span class="section-title">${t}</span><div class="section-line"></div></div>`;
}

// ── render ────────────────────────────────────────────
function render(cat) {
  const cards = cat === 'all' ? CARDS : CARDS.filter(c => c.cat === cat);
  const showFeat = cat === 'all' || cat === FEAT.cat;
  let h = '';

  if (showFeat) {
    h += statsHTML();
    h += secHead('今日头条 · Lead Story');
    h += featHTML(FEAT);
  }

  if (cards.length) {
    h += secHead('深度精选 · In Depth');
    for (let i = 0; i < cards.length; i += 3) {
      const chunk = cards.slice(i, i + 3);
      const cls = chunk.length < 3 ? 'cards-grid-2' : 'cards-grid';
      h += `<div class="${cls}">${chunk.map(cardHTML).join('')}</div>`;
    }
  } else if (!showFeat) {
    h += `<div class="empty">暂无此分类新闻</div>`;
  }

  document.getElementById('grid').innerHTML = h;
}

// ── nav ───────────────────────────────────────────────
let active = 'all';
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('.cat-pill'); if (!b) return;
  document.querySelectorAll('.cat-pill').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); active = b.dataset.c; render(active);
});

// ── ticker ────────────────────────────────────────────
const all = TICKS.concat(TICKS);
document.getElementById('tk').innerHTML = all.map(t => `<span class="tk-item">${t}</span>`).join('');

// ── countdown 2h ─────────────────────────────────────
const TOTAL = 7200; let elapsed = 0;
setInterval(() => {
  elapsed++;
  document.getElementById('prog').style.width = (elapsed / TOTAL * 100) + '%';
  const rem = TOTAL - elapsed;
  const hh = Math.floor(rem / 3600), mm = Math.floor((rem % 3600) / 60), ss = rem % 60;
  const txt = hh > 0 ? `${hh}时${pad(mm)}分后更新` : `${mm}分${pad(ss)}秒后更新`;
  ['nxt','nxt-sm'].forEach(id => { const el=document.getElementById(id); if(el)el.textContent=txt; });
  if (elapsed >= TOTAL) { elapsed = 0; render(active); }
}, 1000);

render('all');
</script>
</body>
</html>
