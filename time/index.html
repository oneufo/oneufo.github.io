<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间 · Time</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;700&display=swap');

  :root {
    --ink: #1a1410;
    --paper: #f5ede0;
    --rust: #c0432a;
    --gold: #b8860b;
    --sand: #d4b896;
    --fog: rgba(26,20,16,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    overflow: hidden;
    cursor: none;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.07;
    pointer-events: none;
    z-index: 100;
  }

  /* Custom cursor */
  #cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: var(--rust);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease;
  }
  #cursor-ring {
    position: fixed;
    width: 32px; height: 32px;
    border: 1px solid var(--rust);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    opacity: 0.5;
    transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
  }

  /* Main layout */
  .stage {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 1fr 2px 1fr;
    grid-template-rows: 1fr;
  }

  /* Vertical divider */
  .divider {
    background: linear-gradient(to bottom, transparent, var(--sand), var(--rust), var(--sand), transparent);
    align-self: stretch;
    opacity: 0.6;
  }

  /* Left panel — clock */
  .panel-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }

  .panel-left::after {
    content: '';
    position: absolute;
    top: -40%;
    left: -20%;
    width: 120%;
    height: 120%;
    background: radial-gradient(ellipse at 60% 40%, rgba(192,67,42,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Orbital clock */
  .clock-wrap {
    position: relative;
    width: min(340px, 80vw);
    height: min(340px, 80vw);
  }

  .clock-label {
    font-family: 'Playfair Display', serif;
    font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin-bottom: 28px;
    opacity: 0.8;
  }

  canvas#clockCanvas {
    width: 100%; height: 100%;
    display: block;
  }

  .digital-time {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--ink);
    text-align: center;
    margin-top: 28px;
  }

  .digital-date {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(11px, 1.2vw, 14px);
    color: var(--rust);
    letter-spacing: 0.2em;
    text-align: center;
    margin-top: 8px;
    opacity: 0.75;
  }

  /* Right panel — philosophy */
  .panel-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 70px;
    position: relative;
    overflow: hidden;
  }

  .panel-right::before {
    content: '"';
    position: absolute;
    top: 30px;
    right: 50px;
    font-family: 'Playfair Display', serif;
    font-size: 240px;
    line-height: 1;
    color: var(--sand);
    opacity: 0.35;
    pointer-events: none;
    user-select: none;
  }

  .tagline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing: 0.3em;
    color: var(--rust);
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0.8;
  }

  .main-quote {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 3.2vw, 44px);
    font-weight: 400;
    line-height: 1.45;
    color: var(--ink);
    margin-bottom: 32px;
  }

  .main-quote em {
    font-style: italic;
    color: var(--rust);
  }

  .sub-text {
    font-size: clamp(13px, 1.3vw, 15px);
    line-height: 1.9;
    color: var(--ink);
    opacity: 0.65;
    max-width: 420px;
    font-weight: 300;
    margin-bottom: 48px;
  }

  /* Life progress bars */
  .stats-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: 100px 1fr 52px;
    align-items: center;
    gap: 12px;
  }

  .stat-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.8;
  }

  .stat-bar-bg {
    height: 2px;
    background: var(--fog);
    border: 1px solid rgba(26,20,16,0.1);
    position: relative;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    background: linear-gradient(to right, var(--rust), var(--gold));
    position: absolute;
    left: 0; top: 0;
    transition: width 1s ease;
  }

  .stat-val {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    text-align: right;
    color: var(--ink);
    opacity: 0.6;
  }

  /* Corner watermark */
  .corner-mark {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--sand);
    opacity: 0.55;
    z-index: 10;
    user-select: none;
  }

  /* Breathing dot */
  .pulse-dot {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--rust);
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 8px;
    animation: breathe 2.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.5); }
  }

  /* Fade-in on load */
  .panel-left, .panel-right {
    animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .panel-right { animation-delay: 0.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hover expand on clock */
  .clock-wrap:hover canvas { filter: drop-shadow(0 0 12px rgba(192,67,42,0.25)); }

  @media (max-width: 700px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 2px 1fr; }
    .divider { align-self: auto; justify-self: stretch; height: 2px; width: auto; }
    .panel-right::before { display: none; }
    .panel-right { padding: 40px 30px; }
    .panel-left { padding: 40px 30px; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div class="stage">
  <!-- LEFT: Clock -->
  <div class="panel-left">
    <div class="clock-label">The Present Moment</div>
    <div class="clock-wrap">
      <canvas id="clockCanvas"></canvas>
    </div>
    <div class="digital-time" id="digitalTime">00:00:00</div>
    <div class="digital-date" id="digitalDate">—</div>
  </div>

  <div class="divider"></div>

  <!-- RIGHT: Philosophy -->
  <div class="panel-right">
    <div class="tagline"><span class="pulse-dot"></span>最有价值之物</div>

    <div class="main-quote">
      时间，是唯一<br>
      <em>无法再生</em><br>
      的资源。
    </div>

    <div class="sub-text">
      金钱可以失而复得，知识可以重新习得，关系可以修复弥合。
      唯有时间，一旦流逝，便永不归来。
      它不偏不倚地馈赠给每一个人，又毫无预警地收回。
    </div>

    <div class="stats-grid">
      <div class="stat-row">
        <span class="stat-label">今日已过</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="dayBar"></div></div>
        <span class="stat-val" id="dayVal">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">本年已过</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="yearBar"></div></div>
        <span class="stat-val" id="yearVal">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">此刻永恒</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="nowBar" style="width:100%"></div></div>
        <span class="stat-val">∞</span>
      </div>
    </div>
  </div>
</div>

<div class="corner-mark">时间 · 2026</div>

<script>
// ── Custom cursor ──────────────────────────────────────
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cur.style.left = mx + 'px';
  cur.style.top  = my + 'px';
});

(function animRing() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px';
  ring.style.top  = ry + 'px';
  requestAnimationFrame(animRing);
})();

// ── Canvas clock ───────────────────────────────────────
const canvas = document.getElementById('clockCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const s = canvas.parentElement.clientWidth;
  canvas.width = s * devicePixelRatio;
  canvas.height = s * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
window.addEventListener('resize', resize);

const ink   = '#1a1410';
const rust  = '#c0432a';
const gold  = '#b8860b';
const sand  = '#d4b896';

function drawClock() {
  const W = canvas.width / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.44;

  ctx.clearRect(0, 0, W, H);

  const now = new Date();
  const h = now.getHours() % 12 + now.getMinutes() / 60;
  const m = now.getMinutes() + now.getSeconds() / 60;
  const s = now.getSeconds() + now.getMilliseconds() / 1000;

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = sand;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.4;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Hour tick marks
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const r1 = R - 4, r2 = R - 14;
    ctx.beginPath();
    ctx.moveTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a));
    ctx.lineTo(cx + r2 * Math.cos(a), cy + r2 * Math.sin(a));
    ctx.strokeStyle = i % 3 === 0 ? gold : sand;
    ctx.lineWidth = i % 3 === 0 ? 1.5 : 0.8;
    ctx.globalAlpha = i % 3 === 0 ? 0.8 : 0.35;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Second arc (progress ring)
  const secAngle = (s / 60) * Math.PI * 2 - Math.PI / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.93, -Math.PI / 2, secAngle);
  ctx.strokeStyle = rust;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.6;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Minute orbit
  const mAngle = (m / 60) * Math.PI * 2 - Math.PI / 2;
  const mR = R * 0.75;
  ctx.beginPath();
  ctx.arc(cx, cy, mR, 0, Math.PI * 2);
  ctx.strokeStyle = sand;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.2;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Minute dot
  ctx.beginPath();
  ctx.arc(cx + mR * Math.cos(mAngle), cy + mR * Math.sin(mAngle), 5, 0, Math.PI * 2);
  ctx.fillStyle = ink;
  ctx.fill();

  // Minute hand line
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + mR * Math.cos(mAngle), cy + mR * Math.sin(mAngle));
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Hour orbit
  const hAngle = (h / 12) * Math.PI * 2 - Math.PI / 2;
  const hR = R * 0.52;
  ctx.beginPath();
  ctx.arc(cx, cy, hR, 0, Math.PI * 2);
  ctx.strokeStyle = sand;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.2;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Hour dot
  ctx.beginPath();
  ctx.arc(cx + hR * Math.cos(hAngle), cy + hR * Math.sin(hAngle), 7, 0, Math.PI * 2);
  ctx.fillStyle = rust;
  ctx.fill();

  // Hour hand line
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + hR * Math.cos(hAngle), cy + hR * Math.sin(hAngle));
  ctx.strokeStyle = rust;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.7;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = ink;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 2, 0, Math.PI * 2);
  ctx.fillStyle = rust;
  ctx.fill();

  requestAnimationFrame(drawClock);
}
drawClock();

// ── Digital time & stats ───────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }

const MONTHS_ZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DAYS_ZH   = ['周日','周一','周二','周三','周四','周五','周六'];

function updateStats() {
  const now = new Date();
  document.getElementById('digitalTime').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('digitalDate').textContent =
    `${now.getFullYear()} · ${MONTHS_ZH[now.getMonth()]} · ${DAYS_ZH[now.getDay()]}`;

  // Day progress
  const dayPct = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400 * 100;
  document.getElementById('dayBar').style.width = dayPct + '%';
  document.getElementById('dayVal').textContent = dayPct.toFixed(1) + '%';

  // Year progress
  const start = new Date(now.getFullYear(), 0, 1);
  const end   = new Date(now.getFullYear() + 1, 0, 1);
  const yearPct = (now - start) / (end - start) * 100;
  document.getElementById('yearBar').style.width = yearPct + '%';
  document.getElementById('yearVal').textContent = yearPct.toFixed(1) + '%';
}

updateStats();
setInterval(updateStats, 1000);
</script>
</body>
</html>
