<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>OneUFO Ai</title>
<style>
:root{--bg:#faf9f5;--text:#1f1e1d;--muted:#8a877f;--line:rgba(31,30,29,.10);--accent:#d97757;--user:rgba(31,30,29,.055);--code:rgba(31,30,29,.05);--field:#fff;
  --serif:"Tiempos Headline","Iowan Old Style","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--text:#ece9e1;--muted:#9a968d;--line:rgba(255,255,255,.10);--user:rgba(255,255,255,.07);--code:rgba(255,255,255,.07);--field:#30302d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--field);border:1px solid var(--line)}

.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;display:flex;justify-content:space-between;align-items:center;z-index:5;background:linear-gradient(var(--bg) 60%,transparent)}
.brand{display:block;color:inherit;text-decoration:none;font-weight:600;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 120px)}
.tools{display:flex;gap:2px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.ibtn:hover{color:var(--text);background:var(--user)}
.ibtn svg{width:19px;height:19px}

#chat{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 76px) 18px calc(env(safe-area-inset-bottom,0px) + 140px);scroll-behavior:smooth}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.msg{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{font-size:17px;align-self:flex-end;max-width:86%;background:var(--user);padding:9px 16px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{display:flex;gap:14px;align-items:flex-start}
.msg.bot .av{flex:none;width:30px;height:30px;margin-top:2px;color:var(--accent)}
.msg.bot .av svg,.hello svg{display:block;width:100%;height:100%}
.msg.bot .body{font-size:17.5px;line-height:1.75;min-width:0;flex:1;overflow-wrap:anywhere}
.body p{margin:0 0 .85em}.body p:last-child{margin:0}
.body h1,.body h2,.body h3{font-family:var(--serif);font-weight:500;line-height:1.3;margin:1.1em 0 .5em}
.body h1{font-size:1.45em}.body h2{font-size:1.25em}.body h3{font-size:1.1em}
.body ul,.body ol{margin:0 0 .85em;padding-left:1.4em}.body li{margin:.2em 0}
.body code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;background:var(--code);padding:.12em .4em;border-radius:6px}
.body pre{background:var(--code);padding:14px 16px;border-radius:12px;overflow-x:auto;margin:.8em 0}
.body pre code{background:none;padding:0;font-size:15px;line-height:1.6}
.err{align-self:center;max-width:90%;font-size:13.5px;padding:10px 16px;border-radius:12px;color:#c0452a;white-space:pre-wrap;text-align:center}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

.hello{text-align:center;margin:12vh auto 0;max-width:520px}
.hello .mark{width:112px;height:112px;margin:0 auto;color:var(--accent)}
.hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5vw,34px);letter-spacing:-.01em;line-height:1.25;margin:22px 0 6px}
.hello p{color:var(--muted);margin:0;font-size:15px}

.dock{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;background:linear-gradient(transparent,var(--bg) 40%)}
.composer{max-width:700px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:7px;border-radius:26px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.composer:focus-within{border-color:var(--accent)}
textarea.in{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;max-height:160px;padding:8px 0 8px 2px;line-height:1.5}
textarea.in::placeholder{color:var(--muted)}
.send{flex:none;width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;transition:opacity .2s}
.send{touch-action:manipulation;-webkit-appearance:none;appearance:none}.send:disabled{opacity:.28;cursor:default}
@media (max-width:600px){.send,.web{width:42px;height:42px}.composer{padding:6px}}.send svg{width:18px;height:18px}
.web{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}.web svg{width:19px;height:19px}.web.on{color:var(--accent);background:rgba(217,119,87,.13)}
.src{font-size:12.5px;color:var(--muted)}.src a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}.src a:hover{color:var(--accent)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}

dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:visible}
dialog::backdrop{background:rgba(20,15,10,.3)}
.sheet{border-radius:20px;padding:22px;max-height:calc(100vh - 24px);overflow-y:auto;background:var(--bg)}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.sheet label{display:block;margin:14px 0 6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.sheet input,.sheet textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;resize:vertical}
.sheet input:focus,.sheet textarea:focus{border-color:var(--accent)}
details{margin-top:16px}summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:" ›";display:inline-block;transition:transform .2s}details[open] summary::after{transform:rotate(90deg)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:9px 18px;border-radius:999px;font-weight:500;font-size:14.5px}
.btn.sec{background:var(--user)}.btn.pri{background:var(--text);color:var(--bg)}

/* exact icon centering (iOS Safari button quirks) */
.send,.web,.ibtn{position:relative;padding:0;line-height:0;display:block}
.send svg,.web svg,.ibtn svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;margin:0}
.send svg{width:18px;height:18px}

/* balanced composer: equal-size side buttons, vertically centered */
.composer{--h:40px;align-items:flex-end}
@media (max-width:600px){.composer{--h:42px}}
.composer .send,.composer .web{width:var(--h);height:var(--h)}
.composer .send svg,.composer .web svg{width:22px;height:22px}
.composer #stop svg{width:24px;height:24px}
.composer textarea.in{line-height:26px;min-height:var(--h);padding:calc((var(--h) - 26px)/2) 4px calc((var(--h) - 26px)/2) 2px}

/* v: hide top-right tools, Claude-style send button, larger globe */
.tools{display:none}
.composer .send{background:var(--accent);color:#fff;border-radius:12px;transition:background .2s,opacity .2s,transform .15s}
.composer .send:not(:disabled):hover{background:#c6613f}
.composer .send:not(:disabled):active{transform:scale(.94)}
.composer .send:disabled{background:var(--accent);opacity:.4}
.composer .web{border-radius:12px}
.composer .web svg{width:26px;height:26px}

/* v: round buttons, globe and send identical size */
.composer .send,.composer .web{width:var(--h);height:var(--h);border-radius:50%}
.composer .web{background:var(--user);color:var(--muted)}
.composer .web.on{background:rgba(217,119,87,.16);color:var(--accent)}
.composer .send svg,.composer .web svg{width:22px;height:22px}
.composer #stop svg{width:24px;height:24px}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="https://oneufo.com/ai/">OneUFO <span style="color:var(--accent)">Ai</span></a>
  <div class="tools">
    <button class="ibtn" id="clear" aria-label="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ibtn" id="cfg" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</div>

<div id="chat"><div class="wrap" id="wrap"></div></div>

<div class="dock">
  <form class="composer glass" id="form">
    <button class="web" id="web" type="button" aria-label="Web search" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></svg></button>
    <textarea class="in" id="input" rows="1" placeholder="Message K-EXAONE"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <button class="send" id="stop" type="button" aria-label="Stop" style="display:none"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="3"/></svg></button>
  </form>
  <div class="foot">AI can make mistakes. Please verify important information.</div>
</div>

<dialog id="dlg">
  <div class="sheet glass">
    <h2>Connect</h2>
    <p class="sub">Your key is stored only in this browser.</p>
    <label>API Key</label>
    <input id="key" type="password" placeholder="Paste your API key" autocomplete="off">
    <details id="adv">
      <summary>Advanced</summary>
      <label>Base URL</label>
      <input id="base" autocomplete="off">
      <label>Model ID (leave empty to auto-detect)</label>
      <input id="model" placeholder="Auto" autocomplete="off">
      <label>System prompt</label>
      <textarea id="sys" rows="2" placeholder="Optional"></textarea>
    </details>
    <div class="acts"><button class="btn sec" id="cancel" type="button">Cancel</button><button class="btn pri" id="save" type="button">Save</button></div>
  </div>
</dialog>

<script>
(function(){
  /* ===== Defaults: edit here once ===== */
  var CONFIG={
    baseUrl:'https://k-exaone.oneufo-com.workers.dev/v1', // Cloudflare Worker proxy (keeps the API key off the page)
    useProxy:true,                          // true = no key needed in the browser
    model:'k-exaone_v2.5',
    reasoningEffort:'low',                  // low = fastest, high = harder problems, max = most accurate (slowest)
    system:'',
    temperature:1.0,
    topP:0.95
  };
  /* ==================================== */
  var $=function(i){return document.getElementById(i)};
  var chat=$('chat'),wrap=$('wrap'),input=$('input'),form=$('form'),dlg=$('dlg');
  var history=[],ctrl=null,modelCache=null,FIELDS=['key','base','model','sys'];
  var STAR='<svg viewBox="0 0 48 48" fill="none"><path d="M16.5 29.5L9 44h30l-7.5-14.5z" fill="currentColor" opacity=".13"/><path d="M16.5 22.5c.6-5.6 3.6-9.5 7.5-9.5s6.9 3.9 7.5 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="24" cy="24.5" rx="19" ry="5.5" fill="currentColor"/><circle cx="14" cy="25" r="1.2" fill="var(--bg)"/><circle cx="24" cy="26" r="1.2" fill="var(--bg)"/><circle cx="34" cy="25" r="1.2" fill="var(--bg)"/></svg>';

  function stored(){try{return JSON.parse(localStorage.getItem('oneufo_ai_cfg3')||'{}')}catch(e){return {}}}
  function cfg(){var s=stored();return{key:s.key||'',base:(s.base||CONFIG.baseUrl).replace(/\/+$/,''),model:s.model||CONFIG.model,sys:s.sys||CONFIG.system}}
  function saveCfg(){var s={},d={base:CONFIG.baseUrl,model:CONFIG.model,sys:CONFIG.system};FIELDS.forEach(function(f){var v=$(f).value.trim();s[f]=(v===d[f])?'':v});try{localStorage.setItem('oneufo_ai_cfg3',JSON.stringify(s))}catch(e){}modelCache=null}
  function fillCfg(){var c=cfg();$('key').value=c.key;$('base').value=c.base;$('model').value=c.model;$('sys').value=c.sys}

  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function inline(t){return esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
  function render(text){
    var parts=text.split(/```/),out='';
    parts.forEach(function(seg,i){
      if(i%2){out+='<pre><code>'+esc(seg.replace(/^[^\n]*\n/,''))+'</code></pre>';return}
      seg.split(/\n{2,}/).forEach(function(blk){
        var ls=blk.split('\n').filter(function(l){return l.trim()});if(!ls.length)return;
        var h=ls[0].match(/^(#{1,3})\s+(.*)/);
        if(h&&ls.length===1){out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';return}
        if(ls.every(function(l){return /^\s*[-*]\s+/.test(l)})){out+='<ul>'+ls.map(function(l){return '<li>'+inline(l.replace(/^\s*[-*]\s+/,''))+'</li>'}).join('')+'</ul>';return}
        if(ls.every(function(l){return /^\s*\d+[.)]\s+/.test(l)})){out+='<ol>'+ls.map(function(l){return '<li>'+inline(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>'}).join('')+'</ol>';return}
        out+='<p>'+ls.map(inline).join('<br>')+'</p>';
      });
    });
    return out;
  }

  function hello(){
    wrap.innerHTML='<div class="hello" id="hello"><div class="mark">'+STAR+'</div><h1>What’s on your mind?</h1><p>Writing, analysis, code, translation — just ask.</p></div>';
  }
  function scroll(){chat.scrollTop=chat.scrollHeight}
  function addUser(t){var h=$('hello');if(h)h.remove();var d=document.createElement('div');d.className='msg user';d.textContent=t;wrap.appendChild(d);scroll()}
  function addBot(){
    var h=$('hello');if(h)h.remove();
    var d=document.createElement('div');d.className='msg bot';
    d.innerHTML='<div class="av">'+STAR+'</div><div class="body"><span class="dots"><i></i><i></i><i></i></span></div>';
    wrap.appendChild(d);scroll();return d;
  }
  function addErr(t){var d=document.createElement('div');d.className='err glass';d.textContent=t;wrap.appendChild(d);scroll()}
  function busy(b){$('send').style.display=b?'none':'';$('stop').style.display=b?'':'none'}

  async function pickModel(c,signal){
    if(c.model)return c.model;
    if(modelCache)return modelCache;
    var h={};if(c.key)h['Authorization']='Bearer '+c.key;
    var r=await fetch(c.base+'/models',{headers:h,signal:signal});
    if(!r.ok)throw new Error('Could not list models (HTTP '+r.status+'). Set a Model ID under Settings › Advanced.');
    var ids=((await r.json()).data||[]).map(function(m){return m.id});
    var m=ids.filter(function(i){return /k-?exaone.*2\.?5/i.test(i)})[0]||ids.filter(function(i){return /exaone/i.test(i)})[0]||ids[0];
    if(!m)throw new Error('No models found. Set a Model ID under Settings › Advanced.');
    return(modelCache=m);
  }

  var webOn=false;
  function webSearch(c,q,signal){
    return fetch(c.base.replace(/\/v1$/,'')+'/search',{method:'POST',signal:signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})})
      .then(function(r){if(!r.ok)throw new Error('search '+r.status);return r.json()})
      .then(function(j){return(j.results||[]).filter(function(r){return /^https?:/.test(r.url)}).slice(0,5)});
  }
  function srcHtml(rs){
    return '<p class="src">'+rs.map(function(r,i){var h;try{h=new URL(r.url).hostname.replace(/^www\./,'')}catch(e){h=r.url}
      return '<a href="'+esc(r.url).replace(/"/g,'%22')+'" target="_blank" rel="noopener">['+(i+1)+'] '+esc(h)+'</a>'}).join(' · ')+'</p>';
  }
  function syncSend(){$('send').disabled=!input.value.trim()}
  function submitForm(){if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event('submit',{cancelable:true}))}
  function openSettings(adv){fillCfg();$('adv').open=!!adv;dlg.showModal()}

  async function send(text){
    var c=cfg();
    if(!c.key&&!CONFIG.useProxy){openSettings(false);return}
    if(/example\.com/.test(c.base)){openSettings(true);return}
    addUser(text);history.push({role:'user',content:text});
    var node=addBot(),body=node.querySelector('.body'),acc='';
    ctrl=new AbortController();busy(true);
    try{
      var srcs=null;
      if(webOn){
        body.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span style="margin-left:8px;color:var(--muted);font-size:14px">Searching the web…</span>';
        try{srcs=await webSearch(c,text,ctrl.signal)}catch(e){if(e.name==='AbortError')throw e;srcs=null}
      }
      var model=await pickModel(c,ctrl.signal);
      var msgs=(c.sys?[{role:'system',content:c.sys}]:[]).concat(history);
      if(srcs&&srcs.length){
        var ctx=srcs.map(function(r,i){return '['+(i+1)+'] '+r.title+' ('+r.url+')\n'+r.content}).join('\n\n');
        msgs=msgs.slice();
        msgs[msgs.length-1]={role:'user',content:'Today is '+new Date().toISOString().slice(0,10)+'. Use the web search results below to answer the question. Cite sources like [1], [2] where relevant. If the results do not contain the answer, say so.\n\nSearch results:\n'+ctx+'\n\nQuestion: '+text};
      }
      var reqInit={method:'POST',signal:ctrl.signal,
        headers:c.key?{'Content-Type':'application/json','Authorization':'Bearer '+c.key}:{'Content-Type':'application/json'},
        body:JSON.stringify({model:model,messages:msgs,stream:true,temperature:CONFIG.temperature,top_p:CONFIG.topP,reasoning_effort:CONFIG.reasoningEffort})};
      var res,tries=0,waits=[2000,4000,8000,12000,16000];
      while(true){
        res=await fetch(c.base+'/chat/completions',reqInit);
        if((res.status===429||res.status===503||res.status===502)&&tries<waits.length){
          body.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span style="margin-left:8px;color:var(--muted);font-size:14px">Service is busy, retrying ('+(tries+1)+'/'+waits.length+')…</span>';
          await new Promise(function(ok,no){var t=setTimeout(ok,waits[tries]);ctrl.signal.addEventListener('abort',function(){clearTimeout(t);no(new DOMException('Aborted','AbortError'))})});
          tries++;continue;
        }
        break;
      }
      if(!res.ok){var et=(await res.text()).slice(0,300);throw new Error(res.status===429?'The service is very busy right now. Please try again in a minute.':'HTTP '+res.status+' '+et)}
      var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
      while(true){
        var r=await rd.read();if(r.done)break;
        buf+=dec.decode(r.value,{stream:true});
        var lines=buf.split('\n');buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var l=lines[i].trim();if(l.indexOf('data:')!==0)continue;
          var d=l.slice(5).trim();if(d==='[DONE]')continue;
          try{var j=JSON.parse(d),dl=j.choices&&j.choices[0]&&j.choices[0].delta;
            if(dl&&dl.reasoning_content&&!acc){body.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span style="margin-left:8px;color:var(--muted);font-size:14px">Thinking…</span>'}
            if(dl&&dl.content){acc+=dl.content;body.innerHTML=render(acc.replace(/^\s+/,''));scroll()}}catch(e){}
        }
      }
      if(acc){history.push({role:'assistant',content:acc.trim()});if(srcs&&srcs.length)body.innerHTML=render(acc.replace(/^\s+/,''))+srcHtml(srcs)}else body.innerHTML='<p style="color:var(--muted)">(No content received)</p>';
    }catch(e){
      if(e.name==='AbortError'){if(acc)history.push({role:'assistant',content:acc});else node.remove()}
      else{node.remove();history.pop();
        addErr('Request failed: '+e.message+(/Failed to fetch/.test(e.message)?'\nCheck your network and Base URL, or the API may block direct browser requests (CORS).':''))}
    }finally{busy(false);ctrl=null;syncSend()}
  }

  form.addEventListener('submit',function(e){e.preventDefault();var t=input.value.trim();if(!t||ctrl)return;input.value='';input.style.height='auto';syncSend();send(t)});
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitForm()}});
  input.addEventListener('input',function(){syncSend();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
  $('web').onclick=function(){webOn=!webOn;this.classList.toggle('on',webOn);this.setAttribute('aria-pressed',webOn)};
  ['send','stop','web'].forEach(function(id){$(id).addEventListener('mousedown',function(e){e.preventDefault()})});
  $('stop').onclick=function(){if(ctrl)ctrl.abort()};
  $('clear').onclick=function(){if(ctrl)ctrl.abort();history=[];hello()};
  $('cfg').onclick=function(){openSettings(false)};
  $('cancel').onclick=function(){dlg.close()};
  $('save').onclick=function(){saveCfg();dlg.close()};
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
  hello();syncSend();
})();
</script>
